; APEX view-cap / first-exposure population-feedback configuration.
; Derived from drive_try1_mix_ppo.ini; historical configurations are unchanged.
; 4B total driver transitions, nominally 2B per policy. No warm-start checkpoint.
; Evaluation benchmark data must be prepared separately.

[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
num_workers = 16
num_envs = 16
batch_size = 4

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
reward_speed_limit = 0.0
reward_lane_alignment = 0.0
reward_lane_distance = 0.0
reward_velocity = 0.0
reward_comfort = 0.0
reward_l_align = 0.0
reward_l_align_vel = 0.5
reward_l_center = 0.0
reward_timestep = 0.0
dt = 0.1
collision_shrink = 0.7
reward_goal = 1.0
reward_goal_post_respawn = 0.25
behavior_conditioning = True
behavior_conditioned_policy_id = 1
behavior_radius_max = 50.0
behavior_radius_sampling = continuous
behavior_view_angle_max = 360.0
behavior_view_sampling = discrete_caps
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 3
goal_target_distance = 30.0
collision_behavior = 2
offroad_behavior = 2
episode_length = 91
resample_frequency = 910
split = "training"
termination_mode = 1
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
idm_others = False
max_controlled_agents = -1
max_obs_partners = 31
mix_traffic = False
ppo_fraction = 1.0
idm_fraction = 0.0
expert_fraction = 0.0
idm_target_velocity = 15.0
idm_random_velocity = False

[train]
seed = 42
total_timesteps = 4_000_000_000
anneal_lr = True
batch_size = 1048576
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
teacher_only = False
teacher_bc_kl_coef = 0.01
bc_weights_path =
kl_coef = 0.1
smart_ref_weights_path =
smart_ref_shift = 5
humanlike_coef = 0.1
opponent_pool = False
opponent_pool_fraction = 0.25
opponent_pool_snapshot_interval = 100
opponent_pool_max_snapshots = 20
opponent_pool_warmup_epochs = 100
mix_ppo = True
mix_ppo_policy_mix = simple:0.5,conditioned:0.5
mix_ppo_policy_names = Drive,DriveBehaviorConditioned
mix_ppo_rnn_names = Recurrent,Recurrent
mix_ppo_policy_paths = ,
mix_ppo_policy_trainable = True,True
mix_ppo_sampling = stratified
mix_ppo_policy_minibatch_sizes = 32768,32768
mix_ppo_policy_update_steps = 16,16
population_adversary = True
population_gamma = 0.98
; Episode decay applies only to the optional legacy_window mode.
population_episode_decay = 0.8
; Select legacy_window for discounted multi-exposure feedback.
population_reward_mode = first_episode
population_epsilon = 0.02
population_rho_min = 0.02
population_rho_max = 0.5
population_std_start = 0.5
population_std_end = 0.2
population_std_decay_samples = 600000
population_batch_size = 256
population_minibatch_size = 64
population_update_epochs = 4
population_clip_coef = 0.2
population_target_kl = 0.03
population_learning_rate = 0.0003
population_max_grad_norm = 1.0
population_monitor_dir = ""
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
split = "training"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]
